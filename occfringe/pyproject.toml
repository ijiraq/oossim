[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occfringe"
version = "0.1.0"
description = "Fresnel diffraction light curves for TNO stellar occultations (port of OOSSIM fresnelT) with JWST/NIRCam fringe modelling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["occfringe"]

[tool.setuptools.package-data]
occfringe = ["data/nircam/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
